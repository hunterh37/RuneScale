plugins { id 'java' }
repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}
def runeLiteVersion = 'latest.release'
dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'org.jmdns:jmdns:3.5.9'
    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}
group = 'org.oldschool.runescape.runescale'
version = '0.1.0'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release.set(11) }
task run(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.oldschool.runescape.runescale.RuneScaleStreamPluginTest'
    jvmArgs '-ea', '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED', '--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED', '-Dsun.java2d.opengl=true', '-Xmx768m'
    args '--developer-mode'
}

configurations.testRuntimeClasspath { resolutionStrategy.force 'org.slf4j:slf4j-api:1.7.36' }
